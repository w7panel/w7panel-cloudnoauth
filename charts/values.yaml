sidecar:
  image:
    repository: zpk.w7.cc/public/w7panel-cloudnoauth
    pullPolicy: IfNotPresent
    tag: v1.0.14

  targetHost: api.w7.cc
  runtimeUID: 1337
  httpPort: 15080
  httpsPort: 15443
  inbound:
    listenPort: 15081
    targetScheme: http
    targetHost: 127.0.0.1
    targetPort: 8080

  issuer:
    name: w7panel-root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

  tls:
    volumeName: w7panel-cloudnoauth-tls
    mountPath: /var/run/w7panel-cloudnoauth

  serviceAccountName: default
  panelNamespace: ""

  env: {}
  extraEnv: []
  resources: {}
