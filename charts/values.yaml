sidecar:
  image:
    repository: zpk.w7.cc/public/w7panel-cloudnoauth
    pullPolicy: IfNotPresent
    tag: v1.0.20

  targetHost: api.w7.cc
  virtualIP: 198.18.0.1
  runtimeUID: 1337
  httpPort: 15080
  httpsPort: 15443
  upstream:
    serviceName: ""
    caFile: /etc/ssl/certs/ca-certificates.crt
  issuer:
    name: w7panel-root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

  tls:
    volumeName: w7panel-cloudnoauth-tls
    mountPath: /var/run/w7panel-cloudnoauth

  # Fallback ServiceAccount when W7PanelArtifact.serviceAccountName is not
  # provided in the resource template context.
  # This library chart grants permissions but does not create or select it.
  serviceAccountName: default
  panelNamespace: ""

  env: {}
  extraEnv: []
  resources: {}
